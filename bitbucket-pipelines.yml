pipelines:
  branches:
    main:
      - step:
          name: Frontend CI for Stage
          runs-on:
            - self.hosted
            - linux.shell
            - stage
          script:
            - node -v
            - npm -v
            - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > .env
            - cat .env
            - npm ci
            - npm run build
            # copy the build
            - sudo cp -r dist/* /var/www/html/
